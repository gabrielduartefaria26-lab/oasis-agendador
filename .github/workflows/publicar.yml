name: publicar oasis

# O cron do GitHub Actions e "melhor esforco": em 23/09/2026 ele atrasou de 15 minutos
# para mais de 3 horas duas vezes no mesmo dia, e dois posts furaram o horario.
# A correcao nao e confiar mais no cron, e sim deixar UM job vivo rodando em plantao:
# ele acorda de 2 em 2 minutos por ate 5 horas e meia e publica o que venceu.
# O cron continua, agora so como gatilho para (re)abrir o plantao; o `cancel-in-progress`
# faz o plantao novo substituir o velho, entao nunca acumula fila.
# Repositorio publico tem minutos de Actions ilimitados, entao o plantao nao custa nada.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      ensaio:
        description: "Ensaio: monta o container e nao publica"
        type: boolean
        default: false
      somente:
        description: "So este id da agenda (vazio = todos)"
        type: string
        default: ""
      plantao:
        description: "Ficar de plantao (desmarque para uma passada so)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publicar-oasis
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: plantao de publicacao
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          VIDEOS_BASE_URL: ${{ secrets.VIDEOS_BASE_URL }}
          SOMENTE: ${{ inputs.somente }}
          ENSAIO: ${{ inputs.ensaio && '1' || '0' }}
          # ensaio e "somente" rodam uma vez e saem; o plantao e para a operacao normal.
          # So vale no disparo manual: no cron os inputs vem vazios, e vazio == false e
          # verdadeiro para o GitHub. Esse erro fez todo cron rodar uma vez e sair em 8 s,
          # e o post das 12:00 de 24/09 so saiu as 12:30, disparado na mao.
          UMA_VEZ: ${{ github.event_name == 'workflow_dispatch' && (inputs.ensaio || inputs.somente != '' || !inputs.plantao) && '1' || '0' }}
        run: |
          git config user.name "agendador"
          git config user.email "agendador@users.noreply.github.com"

          publicar_e_guardar() {
            python3 publicar.py
            local saida=$?
            if [ -n "$(git status --porcelain estado.json)" ]; then
              git add estado.json
              git commit -q -m "estado: $(date -u +%Y-%m-%dT%H:%MZ)"
              # a agenda muda pela minha mao o dia inteiro; rebase antes de empurrar
              git pull -q --rebase origin main || true
              git push -q || true
            fi
            return $saida
          }

          if [ "$UMA_VEZ" = "1" ]; then
            publicar_e_guardar
            exit $?
          fi

          # 165 voltas de 2 minutos = 5h30 de plantao, dentro do teto de 6h do runner
          for volta in $(seq 1 165); do
            # traz agenda nova (posso ter agendado algo enquanto o plantao rodava)
            git pull -q --rebase origin main || true
            publicar_e_guardar || echo "falhou nesta volta, tento de novo em 2 min"
            sleep 120
          done
          echo "plantao encerrado, o proximo cron abre outro"
