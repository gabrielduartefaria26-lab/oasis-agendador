name: gdf outliers

# Pesquisa do @gabrieldfaria_: mesma caça da Oasis com a lista de vendas.
# Só lê perfis públicos (business_discovery); não publica nada em conta nenhuma.
on:
  schedule:
    - cron: "0 11 * * 1"   # segunda 08:00 em Brasilia, depois da caça da Oasis
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gdf-outliers
  cancel-in-progress: false

jobs:
  outliers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: o token enxerga o @gabrieldfaria_?
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          curl -s "https://graph.facebook.com/v21.0/17841402121670664?fields=username,followers_count,media_count&access_token=$IG_TOKEN" | sed "s/$IG_TOKEN/***/g"

      - name: cacar Reels e carrosseis fora da curva
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          REFERENCIAS: gdf/referencias.txt
          SAIDA: gdf/outliers.csv
          SAIDA_CARROSSEL: gdf/outliers-carrossel.csv
        run: python3 outliers.py

      - name: guardar
        run: |
          if [ -n "$(git status --porcelain gdf/outliers.csv gdf/outliers-carrossel.csv)" ]; then
            git config user.name "agendador"
            git config user.email "agendador@users.noreply.github.com"
            git add gdf/outliers.csv gdf/outliers-carrossel.csv
            git commit -m "gdf outliers: $(date -u +%Y-%m-%d)"
            git pull --rebase --quiet origin main
            git push
          fi
