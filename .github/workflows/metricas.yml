name: metricas oasis

on:
  schedule:
    - cron: "0 11 * * *"   # 08:00 em Brasilia, antes de a esteira produzir
  workflow_dispatch:

permissions:
  contents: write

# mesmo grupo da publicacao: as duas commitam no repositorio e nao podem se cruzar
concurrency:
  group: publicar-oasis
  cancel-in-progress: false

jobs:
  metricas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: puxar os numeros de todos os posts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 metricas.py

      - name: guardar
        run: |
          if [ -n "$(git status --porcelain metricas.csv)" ]; then
            git config user.name "agendador"
            git config user.email "agendador@users.noreply.github.com"
            git add metricas.csv
            git commit -m "metricas: $(date -u +%Y-%m-%d)"
            git pull --rebase --quiet origin main
            git push
          fi
