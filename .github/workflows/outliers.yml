name: outliers oasis

on:
  schedule:
    - cron: "0 10 * * 1"   # segunda 07:00 em Brasilia
  workflow_dispatch:

permissions:
  contents: write

# mesmo grupo da publicacao: as duas commitam no repositorio e nao podem se cruzar
concurrency:
  group: publicar-oasis
  cancel-in-progress: false

jobs:
  outliers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cacar Reels fora da curva
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 outliers.py

      - name: guardar
        run: |
          if [ -n "$(git status --porcelain outliers.csv)" ]; then
            git config user.name "agendador"
            git config user.email "agendador@users.noreply.github.com"
            git add outliers.csv
            git commit -m "outliers: $(date -u +%Y-%m-%d)"
            git pull --rebase --quiet origin main
            git push
          fi
